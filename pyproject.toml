[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/*"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "apps/api", "apps/worker", "packages"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
