[project]
name = "coday-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "coday-contracts",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "cryptography>=44",
    "pydantic-settings>=2.8,<3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
coday-contracts = { workspace = true }
