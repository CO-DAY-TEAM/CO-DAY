[project]
name = "coday-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "coday-contracts",
    "PyJWT[crypto]>=2.10,<3",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.16,<2",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
coday-contracts = { workspace = true }
