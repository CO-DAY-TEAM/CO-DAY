[project]
name = "coday-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "coday-contracts",
    "coday-core",
    "openai-agents>=0.23.1,<1",
    "langfuse==5.0.2",
    "openinference-instrumentation-openai-agents==2.5.3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
coday-contracts = { workspace = true }
coday-core = { workspace = true }
