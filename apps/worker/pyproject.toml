[project]
name = "coday-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "coday-contracts",
    "coday-core",
    "coday-pipeline",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
coday-contracts = { workspace = true }
coday-core = { workspace = true }
coday-pipeline = { workspace = true }
